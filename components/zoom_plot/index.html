<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}#plot{width:100%}</style>
<script src="plotly.min.js"></script>
</head>
<body>
<div id="plot"></div>
<script>
// Minimal Streamlit component: draws the figure and reports the visible x-range (zoom) back to Python.
const gd = document.getElementById("plot");
let lastFig = null, lastHeight = null, lastSent = "";

function send(type, extra) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, extra), "*");
}
function reportRange() {
  const r = gd._fullLayout && gd._fullLayout.xaxis && gd._fullLayout.xaxis.range;
  if (!r) return;
  const s = JSON.stringify([r[0], r[1]]);
  if (s === lastSent) return;
  lastSent = s;
  send("streamlit:setComponentValue", {value: {x0: Number(r[0]), x1: Number(r[1])}, dataType: "json"});
}
async function draw(figJson, height) {
  const fig = JSON.parse(figJson);
  fig.layout = fig.layout || {};
  fig.layout.height = height;
  fig.layout.autosize = true;
  gd.style.height = height + "px";
  await Plotly.react(gd, fig.data, fig.layout, {responsive: true, displaylogo: false});
  if (!gd._hasHandler) {
    gd._hasHandler = true;
    gd.on("plotly_relayout", reportRange);          // fires after zoom / pan / reset
  }
  send("streamlit:setFrameHeight", {height: height + 4});
}
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const a = event.data.args || {};
  if (a.fig_json === lastFig && a.height === lastHeight) return;   // same figure: keep the zoom as it is
  lastFig = a.fig_json; lastHeight = a.height;
  draw(a.fig_json, a.height);
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body>
</html>
